services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB:
      POSTGRES_USER:
      POSTGRES_PASSWORD:
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    ports:
      - "5433:5432"

  python-service:
    build: ./python
    ports: [ "8000:8000" ]
    environment:
      DB_HOST:
      DB_NAME:
      DB_USER:
      DB_PASSWORD:
    depends_on:
      - postgres

  spring-backend:
    build: .
    ports: [ "8080:8080" ]
    environment:
      SPRING_DATASOURCE_URL:
      SPRING_DATASOURCE_USERNAME:
      SPRING_DATASOURCE_PASSWORD:
      SPOTIFY_CLIENT_ID:
      SPOTIFY_CLIENT_SECRET:
    depends_on:
      - python-service

  react-frontend:
    build:
      context: ./opusml-frontend
      args:
        REACT_APP_API_URL: http://localhost:8080
    ports:
      - "3000:80"
    depends_on:
      - spring-backend

volumes:
  postgres_data: